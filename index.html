<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#160c26" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Zucca di Jack</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #2a1a3d 0%, #120a1f 60%, #05030a 100%);
    color: #fff;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1 {
    font-size: 1.6rem;
    color: #ff8c1a;
    text-shadow: 0 0 12px rgba(255,140,26,0.6);
    margin-bottom: 6px;
    text-align: center;
  }
  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 0.85rem;
    margin-bottom: 24px;
    text-align: center;
  }

  /* pulsante di connessione */
  #connectBtn {
    width: 100%;
    max-width: 360px;
    margin-bottom: 20px;
    padding: 18px 12px;
    border-radius: 16px;
    border: 2px solid #ff8c1a;
    background: rgba(255,140,26,0.12);
    color: #ffb15c;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  #connectBtn.connected {
    border-color: #4caf50;
    background: rgba(76,175,80,0.12);
    color: #8be28f;
  }
  #connectBtn:disabled { opacity: 0.6; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 360px;
    transition: opacity 0.2s ease;
  }
  .grid.locked { opacity: 0.35; pointer-events: none; }

  .color-btn {
    border: none;
    border-radius: 16px;
    padding: 28px 12px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .color-btn:active { transform: scale(0.95); }
  .btn-rosso  { background: linear-gradient(135deg, #ff3d3d, #a30000); box-shadow: 0 4px 20px rgba(255,61,61,0.4); }
  .btn-blu    { background: linear-gradient(135deg, #3d6bff, #00269e); box-shadow: 0 4px 20px rgba(61,107,255,0.4); }
  .btn-verde  { background: linear-gradient(135deg, #3dff7a, #009e3a); box-shadow: 0 4px 20px rgba(61,255,122,0.4); }
  .btn-bianco { background: linear-gradient(135deg, #ffffff, #b8b8b8); box-shadow: 0 4px 20px rgba(255,255,255,0.35); color: #1a1a1a; }
  .btn-off    { background: linear-gradient(135deg, #555, #1a1a1a); box-shadow: 0 4px 20px rgba(0,0,0,0.4); grid-column: span 2; }

  .status {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex: none; }
  .dot.ok { background: #4caf50; animation: pulse 2s infinite; }
  .dot.wait { background: #ffb300; animation: pulse 1s infinite; }
  .dot.err { background: #f44336; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #unsupported {
    display: none;
    max-width: 360px;
    margin-top: 20px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(244,67,54,0.15);
    border: 1px solid rgba(244,67,54,0.5);
    font-size: 0.9rem;
    line-height: 1.4;
    text-align: center;
  }

  /* pulsante per scollegarsi */
  #disconnectBtn {
    width: 100%;
    max-width: 360px;
    margin-top: 16px;
    padding: 14px 12px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.28);
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  #disconnectBtn:disabled { opacity: 0.3; }

  /* decorazioni di Halloween: ragnatele e ragni (non cliccabili) */
  body > *:not(.deco):not(svg) { position: relative; z-index: 1; }
  .deco { position: fixed; pointer-events: none; z-index: 0; }
  .web { width: min(34vw, 130px); height: min(34vw, 130px); opacity: 0.5; }
  .web-tl { top: 0; left: 0; }
  .web-tr { top: 0; right: 0; transform: scaleX(-1); }
  .web-bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .web-br { bottom: 0; right: 0; transform: scale(-1, -1); }
  .web path { fill: none; stroke: #cfc6e6; stroke-width: 1; stroke-linecap: round; }
  .hang {
    top: 0; right: 5%;
    display: flex; flex-direction: column; align-items: center;
    transform-origin: top center;
    animation: swing 3.6s ease-in-out infinite alternate;
  }
  .hang .thread { width: 1.5px; height: 90px; background: rgba(230,224,245,0.55); }
  .hang svg { width: 44px; height: 41px; }
  .spider-small { bottom: 14px; right: 36%; width: 30px; height: 28px; opacity: 0.9; }
  .spider-web { top: 30px; left: 34px; width: 28px; height: 26px; }
  @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .hang { animation: none; } }
</style>
</head>
<body>
  <!-- disegni riutilizzabili: ragnatela e ragno -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="webshape" viewBox="0 0 150 150">
        <path d="M0 0L150.0 0.0M0 0L138.6 57.4M0 0L106.1 106.1M0 0L57.4 138.6M0 0L0.0 150.0M35.0 0.0Q29.0 5.8 32.3 13.4M32.3 13.4Q24.5 16.4 24.7 24.7M24.7 24.7Q16.4 24.5 13.4 32.3M13.4 32.3Q5.8 29.0 0.0 35.0M65.0 0.0Q53.8 10.7 60.1 24.9M60.1 24.9Q45.6 30.5 46.0 46.0M46.0 46.0Q30.5 45.6 24.9 60.1M24.9 60.1Q10.7 53.8 0.0 65.0M95.0 0.0Q78.6 15.6 87.8 36.4M87.8 36.4Q66.6 44.5 67.2 67.2M67.2 67.2Q44.5 66.6 36.4 87.8M36.4 87.8Q15.6 78.6 0.0 95.0M125.0 0.0Q103.4 20.6 115.5 47.8M115.5 47.8Q87.7 58.6 88.4 88.4M88.4 88.4Q58.6 87.7 47.8 115.5M47.8 115.5Q20.6 103.4 0.0 125.0M150.0 0.0Q124.1 24.7 138.6 57.4M138.6 57.4Q105.2 70.3 106.1 106.1M106.1 106.1Q70.3 105.2 57.4 138.6M57.4 138.6Q24.7 124.1 0.0 150.0" fill="none" stroke="#cfc6e6" stroke-width="1" stroke-linecap="round"/>
      </symbol>
      <symbol id="spider" viewBox="0 0 60 56">
        <g fill="none" stroke="#8a5cc7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="25,28 12,12 4,22"/>
          <polyline points="24,31 8,24 1,36"/>
          <polyline points="24,35 8,36 2,50"/>
          <polyline points="26,39 13,46 8,55"/>
          <polyline points="35,28 48,12 56,22"/>
          <polyline points="36,31 52,24 59,36"/>
          <polyline points="36,35 52,36 58,50"/>
          <polyline points="34,39 47,46 52,55"/>
        </g>
        <ellipse cx="30" cy="37" rx="9" ry="10" fill="#0d0716" stroke="#8a5cc7" stroke-width="1.4"/>
        <circle cx="30" cy="25" r="6" fill="#0d0716" stroke="#8a5cc7" stroke-width="1.4"/>
        <path d="M30 31l3 5-3 5-3-5z" fill="#ff8c1a" opacity="0.85"/>
        <circle cx="27.5" cy="24" r="1.4" fill="#ff8c1a"/>
        <circle cx="32.5" cy="24" r="1.4" fill="#ff8c1a"/>
      </symbol>
    </defs>
  </svg>

  <!-- decorazioni -->
  <svg class="deco web web-tl" viewBox="0 0 150 150" aria-hidden="true"><use href="#webshape"/></svg>
  <svg class="deco web web-tr" viewBox="0 0 150 150" aria-hidden="true"><use href="#webshape"/></svg>
  <svg class="deco web web-bl" viewBox="0 0 150 150" aria-hidden="true"><use href="#webshape"/></svg>
  <svg class="deco web web-br" viewBox="0 0 150 150" aria-hidden="true"><use href="#webshape"/></svg>
  <svg class="deco spider-web" viewBox="0 0 60 56" aria-hidden="true"><use href="#spider"/></svg>
  <svg class="deco spider-small" viewBox="0 0 60 56" aria-hidden="true"><use href="#spider"/></svg>
  <div class="deco hang" aria-hidden="true">
    <div class="thread"></div>
    <svg viewBox="0 0 60 56"><use href="#spider"/></svg>
  </div>

  <h1>🎃 Zucca di Jack</h1>
  <div class="subtitle">Controllo Bluetooth · v2.0</div>

  <button id="connectBtn" type="button">CONNETTI ALLA ZUCCA</button>

  <div class="grid locked" id="grid">
    <button class="color-btn btn-rosso"  data-cmd="rosso"  type="button">ROSSO</button>
    <button class="color-btn btn-blu"    data-cmd="blu"    type="button">BLU</button>
    <button class="color-btn btn-verde"  data-cmd="verde"  type="button">VERDE</button>
    <button class="color-btn btn-bianco" data-cmd="bianco" type="button">BIANCO</button>
    <button class="color-btn btn-off"    data-cmd="off"    type="button">SPEGNI</button>
  </div>

  <button id="disconnectBtn" type="button" disabled>SCOLLEGA</button>

  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">non connesso</span>
  </div>

  <div id="unsupported">
    Questo browser non supporta il Bluetooth web.<br>
    Apri la pagina con Chrome su Android.
  </div>

<script>
// Gli UUID devono essere identici a quelli dello script sulla scheda (zucca_ble.py)
const SERVICE_UUID = '12345678-1234-5678-1234-56789abcdef0';
const CHAR_UUID    = '12345678-1234-5678-1234-56789abcdef1';
const DEVICE_NAME  = 'ZuccaDiJack';

let device = null;
let characteristic = null;
let reconnecting = false;
let manualDisconnect = false;

const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const grid = document.getElementById('grid');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');

function setStatus(text, kind) {
  statusText.textContent = text;
  dot.className = 'dot ' + (kind || '');
}

function setConnected(isConnected) {
  grid.classList.toggle('locked', !isConnected);
  connectBtn.classList.toggle('connected', isConnected);
  connectBtn.textContent = isConnected ? 'COLLEGATO ✓' : (device ? 'RICONNETTI' : 'CONNETTI ALLA ZUCCA');
  connectBtn.disabled = false;
  disconnectBtn.disabled = !isConnected;
}

function disconnect() {
  manualDisconnect = true;
  characteristic = null;
  if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
  setConnected(false);
  setStatus('scollegato', '');
}

async function openGatt() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  characteristic = await service.getCharacteristic(CHAR_UUID);
  setConnected(true);
  setStatus('collegato', 'ok');
}

async function connect() {
  manualDisconnect = false;
  connectBtn.disabled = true;
  setStatus('connessione…', 'wait');
  try {
    if (!device) {
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
    }
    await openGatt();
  } catch (e) {
    console.error(e);
    setConnected(false);
    setStatus(e && e.name === 'NotFoundError' ? 'nessun dispositivo scelto' : 'connessione fallita, riprova', 'err');
  }
}

// Se la connessione cade, la pagina riprova da sola alcune volte
async function onDisconnected() {
  characteristic = null;
  setConnected(false);
  if (manualDisconnect || reconnecting || !device) return;
  reconnecting = true;
  for (let i = 1; i <= 5; i++) {
    if (manualDisconnect) break;
    setStatus('riconnessione (' + i + '/5)…', 'wait');
    try {
      await new Promise(r => setTimeout(r, 1500));
      await openGatt();
      reconnecting = false;
      return;
    } catch (e) { /* riprovo */ }
  }
  reconnecting = false;
  setConnected(false);
  setStatus('scollegato: premi RICONNETTI', 'err');
}

async function send(cmd) {
  if (!characteristic) { setStatus('non connesso', 'err'); return; }
  try {
    const data = new TextEncoder().encode(cmd);
    if (characteristic.writeValueWithResponse) {
      await characteristic.writeValueWithResponse(data);
    } else {
      await characteristic.writeValue(data);
    }
    setStatus('inviato: ' + cmd, 'ok');
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    console.error(e);
    setStatus('invio fallito, riconnetto…', 'err');
    onDisconnected();
  }
}

connectBtn.addEventListener('click', () => {
  if (!characteristic) connect();
});
disconnectBtn.addEventListener('click', disconnect);
document.querySelectorAll('.color-btn').forEach(b => {
  b.addEventListener('click', () => send(b.dataset.cmd));
});

if (!('bluetooth' in navigator)) {
  document.getElementById('unsupported').style.display = 'block';
  connectBtn.disabled = true;
  setStatus('Bluetooth non supportato', 'err');
}

// Service worker: permette l'uso offline e l'installazione come app
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
